name: Bug report
description: Report something that does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.

        Security vulnerabilities must not be reported here. Use [private vulnerability reporting](https://github.com/lucasbrito-wdt/mcpgw/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: mcpgw version or commit
      description: In the admin UI, open Configurações (Settings) and copy "Versão" and "Commit". For a local build, `git rev-parse HEAD` or `go version -m bin/mcpgw` (look for `vcs.revision`).
      placeholder: "v0.1.0 or 1a2b3c4d"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Where the gateway runs, with the version and architecture.
      placeholder: "macOS 15 (arm64), Ubuntu 24.04 (amd64), ..."
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      description: Output of `SELECT version();`.
      placeholder: "PostgreSQL 18.0"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      description: The client connected to the gateway when the problem happened.
      options:
        - Claude Code
        - Codex
        - Cursor
        - Other
        - Not applicable (admin UI, portal or CLI only)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and include any error message you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that triggers the problem, starting from a fresh database if possible.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant gateway output. **Redact secrets before pasting**: access and refresh tokens, `MCPGW_MASTER_KEY`, database URLs with passwords, upstream API keys, and cookies or `Authorization` headers.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: not-security
    attributes:
      label: Security check
      options:
        - label: This is not a security vulnerability. I understand that vulnerabilities must be reported privately through SECURITY.md.
          required: true
