version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # wazero 1.12 rejects the qjs module compiled in one runtime and instantiated in another
      # ("signature mismatch" on env.jsFunctionProxy). Lift once third_party/qjs compiles per runtime.
      - dependency-name: github.com/tetratelabs/wazero
        versions: [">= 1.12.0"]

  - package-ecosystem: npm
    directory: /web/admin
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # CI builds with Node 22; @types/node majors would type APIs that runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
