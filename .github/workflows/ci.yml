name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Throwaway service-container credential. Superuser, so the DB tests can CREATE DATABASE.
  MCPGW_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # 18 or newer: the migrations use the built-in uuidv7().
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: internal/sandbox/montyrs/worker
      - run: make worker
      - run: make lint
      - run: go build ./...
      - run: go test ./...
        env:
          MCPGW_MONTYRS_WORKER: ${{ github.workspace }}/bin/montyrs-worker

  # The worker confines itself per OS (seccomp, Seatbelt, AppContainer), so it is tested on all three.
  montyrs:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: internal/sandbox/montyrs/worker -> target
      - run: cargo build --release --manifest-path internal/sandbox/montyrs/worker/Cargo.toml
      - run: go test ./internal/sandbox/montyrs/ -count=1
        env:
          MCPGW_MONTYRS_WORKER: ${{ github.workspace }}/internal/sandbox/montyrs/worker/target/release/montyrs-worker${{ runner.os == 'Windows' && '.exe' || '' }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v7
      # defaults.run does not reach uses: steps, so the package.json path is explicit.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/admin/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  # playwright.config.ts has no webServer: e2e/global-setup.ts builds the UI and the gateway,
  # creates the mcpgw_e2e database through psql and boots the gateway and the fake upstream itself.
  e2e:
    needs: [go, web]
    runs-on: ubuntu-24.04 # Playwright 1.55 has no browsers for ubuntu 26.04 yet
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web/admin
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/admin/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml
      # global-setup.ts shells out to psql; the runner image usually has it already.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: web/admin/test-results
          if-no-files-found: ignore
